/*
 * This file was generated by the Gradle 'init' task.
 *
 * This project uses @Incubating APIs which are subject to change.
 */

plugins {
    id 'core.java-application-conventions'
}

dependencies {
    implementation 'org.apache.commons:commons-text:1.10.0'
    implementation project(':utilities')
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    // added to test pinned vs unpinned
    implementation 'io.dropwizard:dropwizard-core:(2.1.0,2.1.5]'
    // Intentionally vulnerable (CVE-2021-44228 Log4Shell); for scanner/demo only — remove or upgrade before production
    implementation 'org.apache.logging.log4j:log4j-core:2.14.1'
    // Intentionally vulnerable (CVE-2022-1471 SnakeYaml unsafe deserialization); scanner/demo only
    implementation 'org.yaml:snakeyaml:1.32'
    // Intentionally vulnerable (CVE-2021-33813 JDOM2 SAXBuilder XXE); scanner/demo only — obscure vs Jackson/Log4j
    implementation 'org.jdom:jdom2:2.0.6'

}
version '1.0.4'
application {
    // Define the main class for the application.
    mainClass = 'core.app.App'
}
